{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>autoframework - メインページ</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>autoframework</h1>
        <nav>
            <ul>
                <li><a href="{% url 'automation:dynamic_form' schema_name='recognition' %}">EDIアラート入力</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <!-- JSONエクスポート機能 -->
            <p>JSONエクスポート機能:</p>
            <ul>
                <li>
                    <a href="{% url 'automation:export_unified' schema_name='Evaluation' %}" class="button">
                        Evaluation JSON エクスポート
                    </a>
                </li>
                <li>
                    <a href="{% url 'automation:export_unified' schema_name='Decision' %}" class="button">
                        Decision JSON エクスポート
                    </a>
                </li>
                <li>
                    <a href="{% url 'automation:export_unified' schema_name='Recognition' %}" class="button">
                        Recognition JSON エクスポート
                    </a>
                </li>
            </ul>

            <!-- 条件選択付きのエクスポートフォーム -->
            <p>スキーマを選択してエクスポート:</p>
            <form method="get" action="{% url 'automation:export_schema_filtered' %}">
                <label for="ex_schema">スキーマを選択:</label>
                <select id="ex_schema" name="schema_name">
                    <option value="Recognition">Recognition</option>
                    <option value="Evaluation">Evaluation</option>
                    <option value="Decision">Decision</option>
                </select>
                <button type="submit">エクスポート</button>
            </form>

            <!-- スキーマを選択してインポート -->
            <p>スキーマを選択してインポート:</p>
            <form method="post" enctype="multipart/form-data" id="import-select-form">
<!--                <form method="post" enctype="multipart/form-data" id="import_{{ schema_name }}">-->

                {% csrf_token %}
                <!-- スキーマ選択 -->
                <label for="in_schema">スキーマを選択:</label>
                <select id="in_schema" name="schema_name" required onchange="updateAction()">
                    <option value="Recognition">Recognition</option>
                    <option value="Evaluation">Evaluation</option>
                    <option value="Decision">Decision</option>
                </select>
                <br><br>

                <!-- ファイル選択 -->
                <label for="import_file">Excel／JSONファイルを選択:</label><br>
                <input type="file" id="import_file" name="import_file" accept=".xlsx, .xls, .json" required><br><br>

                <!-- 送信ボタン -->
                <button type="submit">インポート</button>
            </form>
        </section>

        <!-- データインポート機能 -->
        <section>
            <h2>データインポート</h2>

            <!-- Evaluation インポート -->
            <form method="post" enctype="multipart/form-data"
                  action="{% url 'automation:import_evaluation' %}">
                {% csrf_token %}
                <label>Evaluation：</label>
                <input type="file" name="file" accept=".json,.xlsx,.xls" required>
                <button type="submit">インポート</button>
            </form>

            <br>

            <!-- Decision インポート -->
            <form method="post" enctype="multipart/form-data"
                  action="{% url 'automation:import_decision' %}">
                {% csrf_token %}
                <label>Decision：</label>
                <input type="file" name="file" accept=".json,.xlsx,.xls" required>
                <button type="submit">インポート</button>
            </form>
        </section>

    </main>

    <script>
        function updateAction() {
            const schema = document.getElementById('in_schema').value;
            const form = document.getElementById('import-select-form');
            form.action = `/automation/import-filtered/${in_schema}/`;
            console.log("更新されたフォームアクション: ", form.action);
        }

        // 初期表示時にアクションを更新
        window.addEventListener('load', updateAction);

        // 念のため送信時にもアクションを更新
        document.getElementById('import-select-form').addEventListener('submit', function(event) {
            updateAction();
        });
    </script>
</body>
</html>
